# Pushing a vX.Y.Z tag builds and tests the release, publishes the five packages to npm with
# provenance through npm trusted publishing (no stored npm token), then deploys the docs site.
name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: node:24-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          for pkg in package.json packages/*/package.json; do
            actual=$(node -p "require('./$pkg').version")
            [ "$actual" = "$version" ] || { echo "$pkg is $actual, tag is $GITHUB_REF_NAME"; exit 1; }
          done
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: kjun-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/docs/package-lock.json') }}
          restore-keys: kjun-${{ runner.os }}-
      - run: npm run setup
      - run: npm test
      - run: npm run test:browser:smoke
      - run: npm run test:docs:smoke
      # Docs tests build with test-only timings; rebuild the docs for production.
      - run: npm run workflow -- npm --prefix apps/docs run build
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/kjun-ui-*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: apps/docs/dist
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:24-bookworm-slim
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
      # Dependency order: icons → tokens → platform packages. A version already on npm is skipped:
      # a new package's first version is published by hand so its trusted publisher can be configured.
      - run: |
          version="${GITHUB_REF_NAME#v}"
          for name in icons tokens vue3 react native; do
            # npm view prints nothing (and exits 0) for a missing version of an existing package.
            if [ "$(npm view "@kjun-ui/$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "@kjun-ui/$name@$version is already published; skipping"
            else
              npm publish "./kjun-ui-$name-$version.tgz" --access public --provenance
            fi
          done

  deploy-docs:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    container: node:24-bookworm-slim
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: dist
      - run: npx --yes wrangler@4.92.0 deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
