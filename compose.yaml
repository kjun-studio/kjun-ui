services:
  dev:
    image: node:24-bookworm-slim
    container_name: kjun_ui_dev
    init: true
    working_dir: /workspace
    command: sleep infinity
    ports: ["127.0.0.1:4173:4173"]
    volumes:
      - .:/workspace
      - kjun_ui_node_modules:/workspace/node_modules
      - kjun_ui_docs_node_modules:/workspace/apps/docs/node_modules
      - kjun_ui_playwright:/root/.cache/ms-playwright
volumes:
  kjun_ui_node_modules:
    name: kjun_ui_node_modules
  kjun_ui_docs_node_modules:
    name: kjun_ui_docs_node_modules
  kjun_ui_playwright:
    name: kjun_ui_playwright

